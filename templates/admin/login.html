<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — BytePress CMS</title>
    <meta name="robots" content="noindex, nofollow">

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Outfit', 'Plus Jakarta Sans', 'system-ui', 'sans-serif'],
                    },
                    colors: {
                        crimson: {
                            400: '#e91e63',
                            500: '#d81b60',
                            600: '#c2185b',
                            700: '#ad1457',
                            800: '#880e4f',
                            900: '#580633',
                        },
                        saffron: {
                            400: '#ffca28',
                            500: '#ff9800',
                            600: '#f57c00',
                        }
                    },
                    animation: {
                        'float': 'float 6s ease-in-out infinite',
                    },
                    keyframes: {
                        float: {
                            '0%, 100%': { transform: 'translateY(0px)' },
                            '50%': { transform: 'translateY(-8px)' },
                        }
                    }
                }
            }
        }
    </script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- Alpine.js -->
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>

    <style>
        body { background: #0a0a0f; }
        .bg-grid {
            background-image: radial-gradient(circle, rgba(173,20,87,0.12) 1px, transparent 1px);
            background-size: 32px 32px;
        }
        .glass {
            background: rgba(15, 15, 25, 0.85);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
        }
        input:-webkit-autofill,
        input:-webkit-autofill:hover,
        input:-webkit-autofill:focus {
            -webkit-box-shadow: 0 0 0px 1000px #1a1a2e inset;
            -webkit-text-fill-color: #fff;
            transition: background-color 5000s ease-in-out 0s;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 font-sans selection:bg-crimson-700 selection:text-white relative overflow-hidden">

    <!-- Ambient background grid -->
    <div class="bg-grid absolute inset-0 opacity-60 pointer-events-none"></div>

    <!-- Glowing orbs -->
    <div class="absolute top-1/4 left-1/4 w-96 h-96 bg-crimson-700/20 rounded-full blur-3xl pointer-events-none animate-pulse"></div>
    <div class="absolute bottom-1/4 right-1/4 w-64 h-64 bg-saffron-500/10 rounded-full blur-3xl pointer-events-none"></div>

    <div class="w-full max-w-sm relative z-10" x-data="{ showPass: false, user: '', pass: '' }">

        <!-- Back to portal -->
        <div class="text-center mb-5">
            <a href="/" class="inline-flex items-center gap-2 text-xs font-medium text-gray-500 hover:text-saffron-400 transition-colors duration-200 group">
                <i class="fas fa-arrow-left text-saffron-500 group-hover:-translate-x-1 transition-transform duration-200"></i>
                Back to BytePress Portal
            </a>
        </div>

        <!-- Card -->
        <div class="glass border border-white/10 rounded-2xl p-7 shadow-2xl relative overflow-hidden">

            <!-- Top accent bar -->
            <div class="absolute top-0 left-0 right-0 h-0.5 bg-gradient-to-r from-crimson-700 via-saffron-500 to-crimson-700 rounded-t-2xl"></div>

            <!-- Logo + Branding -->
            <div class="text-center mb-8">
                <div class="inline-block animate-float mb-4">
                    <img src="/static/images/logo.png" alt="BytePress Logo" class="h-16 w-auto mx-auto drop-shadow-lg">
                </div>
                <h1 class="text-2xl font-black text-white tracking-tight leading-tight">BytePress</h1>
                <p class="text-xs font-semibold text-saffron-500 uppercase tracking-widest mt-0.5">CMS Dashboard</p>
                <p class="text-xs text-gray-500 mt-2">Sign in to your staff account</p>
            </div>

            <!-- Error message -->
            {% if form.errors %}
            <div class="mb-5 bg-crimson-900/50 border border-crimson-700/60 rounded-xl p-3.5 flex items-start gap-3">
                <i class="fas fa-circle-exclamation text-crimson-400 mt-0.5 flex-shrink-0"></i>
                <div>
                    <p class="text-xs font-bold text-crimson-200">Login Failed</p>
                    <p class="text-[11px] text-crimson-300/80 mt-0.5">Please check your username and password and try again.</p>
                </div>
            </div>
            {% endif %}

            <!-- Login Form -->
            <form action="{{ app_path }}" method="post" id="login-form" autocomplete="on">
                {% csrf_token %}
                <input type="hidden" name="next" value="{{ next }}">

                <!-- Username -->
                <div class="mb-4">
                    <label for="id_username" class="block text-[11px] font-bold uppercase tracking-widest text-gray-400 mb-2">Username</label>
                    <div class="relative">
                        <i class="fas fa-user absolute left-3.5 top-1/2 -translate-y-1/2 text-gray-500 text-sm pointer-events-none"></i>
                        <input type="text" name="username" id="id_username" x-model="user"
                               required autofocus autocomplete="username"
                               placeholder="Enter your username"
                               class="w-full pl-10 pr-4 py-3 bg-white/5 border border-white/10 rounded-xl focus:ring-2 focus:ring-crimson-500 focus:border-crimson-500 text-sm text-white placeholder-gray-600 outline-none transition duration-200 hover:border-white/20">
                    </div>
                </div>

                <!-- Password -->
                <div class="mb-6">
                    <label for="id_password" class="block text-[11px] font-bold uppercase tracking-widest text-gray-400 mb-2">Password</label>
                    <div class="relative">
                        <i class="fas fa-lock absolute left-3.5 top-1/2 -translate-y-1/2 text-gray-500 text-sm pointer-events-none"></i>
                        <input :type="showPass ? 'text' : 'password'" name="password" id="id_password" x-model="pass"
                               required autocomplete="current-password"
                               placeholder="••••••••••••"
                               class="w-full pl-10 pr-10 py-3 bg-white/5 border border-white/10 rounded-xl focus:ring-2 focus:ring-crimson-500 focus:border-crimson-500 text-sm text-white placeholder-gray-600 outline-none transition duration-200 hover:border-white/20">
                        <button type="button" @click="showPass = !showPass"
                                class="absolute right-3.5 top-1/2 -translate-y-1/2 text-gray-500 hover:text-gray-200 transition-colors duration-200">
                            <i class="fas" :class="showPass ? 'fa-eye-slash' : 'fa-eye'" style="font-size: 13px;"></i>
                        </button>
                    </div>
                </div>

                <!-- Submit -->
                <button type="submit"
                        class="w-full py-3 bg-gradient-to-r from-crimson-700 to-crimson-600 hover:from-crimson-600 hover:to-crimson-500 text-white font-bold text-sm rounded-xl shadow-lg hover:shadow-crimson-500/25 transition-all duration-200 transform hover:-translate-y-0.5 active:translate-y-0 flex items-center justify-center gap-2.5">
                    <i class="fas fa-sign-in-alt"></i>
                    Sign In to Dashboard
                </button>
            </form>

            <!-- Demo quick-fill section -->
            <div class="mt-6 pt-5 border-t border-white/8">
                <p class="text-center text-[10px] font-bold uppercase tracking-widest text-gray-600 mb-3">
                    <i class="fas fa-key text-saffron-600 mr-1.5"></i>Quick Demo Access
                </p>
                <div class="grid grid-cols-2 gap-2">
                    <button type="button" @click="user = 'superadmin'; pass = 'Password123!'"
                            class="group p-2.5 bg-white/4 hover:bg-crimson-900/40 border border-white/8 hover:border-crimson-700/60 rounded-xl text-left transition-all duration-200">
                        <div class="flex items-center gap-2">
                            <i class="fas fa-user-shield text-saffron-500 text-xs group-hover:scale-110 transition-transform"></i>
                            <div>
                                <p class="text-[11px] font-bold text-white">Super Admin</p>
                                <p class="text-[10px] text-gray-500">superadmin</p>
                            </div>
                        </div>
                    </button>
                    <button type="button" @click="user = 'editor_user'; pass = 'Password123!'"
                            class="group p-2.5 bg-white/4 hover:bg-crimson-900/40 border border-white/8 hover:border-crimson-700/60 rounded-xl text-left transition-all duration-200">
                        <div class="flex items-center gap-2">
                            <i class="fas fa-edit text-saffron-500 text-xs group-hover:scale-110 transition-transform"></i>
                            <div>
                                <p class="text-[11px] font-bold text-white">Editor</p>
                                <p class="text-[10px] text-gray-500">editor_user</p>
                            </div>
                        </div>
                    </button>
                    <button type="button" @click="user = 'author_user'; pass = 'Password123!'"
                            class="group p-2.5 bg-white/4 hover:bg-crimson-900/40 border border-white/8 hover:border-crimson-700/60 rounded-xl text-left transition-all duration-200">
                        <div class="flex items-center gap-2">
                            <i class="fas fa-pen-nib text-saffron-500 text-xs group-hover:scale-110 transition-transform"></i>
                            <div>
                                <p class="text-[11px] font-bold text-white">Author</p>
                                <p class="text-[10px] text-gray-500">author_user</p>
                            </div>
                        </div>
                    </button>
                    <button type="button" @click="user = 'moderator_user'; pass = 'Password123!'"
                            class="group p-2.5 bg-white/4 hover:bg-crimson-900/40 border border-white/8 hover:border-crimson-700/60 rounded-xl text-left transition-all duration-200">
                        <div class="flex items-center gap-2">
                            <i class="fas fa-user-check text-saffron-500 text-xs group-hover:scale-110 transition-transform"></i>
                            <div>
                                <p class="text-[11px] font-bold text-white">Moderator</p>
                                <p class="text-[10px] text-gray-500">moderator_user</p>
                            </div>
                        </div>
                    </button>
                </div>
            </div>
        </div>

        <!-- Footer -->
        <p class="text-center text-[11px] text-gray-700 mt-5">
            &copy; 2026 BytePress Media Network &mdash; Fast. Precise. Byte-Sized.
        </p>
    </div>

</body>
</html>
